<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoSync SaaS - Post & Media Manager (Admin)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 min-h-screen text-stone-800">

    <!-- Top Bar Admin -->
    <header class="bg-white border-b border-stone-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <span class="bg-stone-900 text-white text-xs px-2.5 py-1 rounded-md font-mono uppercase tracking-wider">RestoSync Admin</span>
            <h1 class="font-bold text-base text-stone-900">Post, Journal & Media Manager</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span id="blogStatus" class="text-xs text-stone-500 italic">Siap mengelola artikel</span>
            <button onclick="saveBlogPost()" class="bg-stone-900 hover:bg-stone-800 text-white text-xs font-semibold px-4 py-2 rounded-xl transition shadow-sm">
                <i class="fa-solid fa-cloud-arrow-up mr-1.5"></i> Publikasikan Artikel
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-6 py-10 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Sidebar Tenant & Post List -->
        <div class="space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-stone-200/80 shadow-sm space-y-4">
                <h2 class="font-semibold text-sm text-stone-900 uppercase tracking-wider">Konfigurasi Tenant</h2>
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">Tenant ID</label>
                    <input type="text" id="tenantIdInput" value="boluhalus" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2 text-xs font-mono text-stone-800 focus:outline-none focus:border-stone-400">
                </div>
                <button onclick="loadTenantPosts()" class="w-full bg-stone-100 hover:bg-stone-200 text-stone-800 text-xs font-semibold py-2 rounded-xl transition">
                    Muat Daftar Post
                </button>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-stone-200/80 shadow-sm space-y-3">
                <h2 class="font-semibold text-sm text-stone-900 uppercase tracking-wider">Daftar Artikel Tersimpan</h2>
                <div id="postListContainer" class="space-y-2 max-h-60 overflow-y-auto text-xs text-stone-600">
                    <p class="text-stone-400 italic">Klik 'Muat Daftar Post' untuk melihat artikel.</p>
                </div>
            </div>
        </div>

        <!-- Form Editor Post & Penempatan Gambar (2 Kolom) -->
        <div class="md:col-span-2 space-y-6">
            
            <div class="bg-white p-6 rounded-2xl border border-stone-200/80 shadow-sm space-y-4">
                <h2 class="font-semibold text-sm text-stone-900 uppercase tracking-wider border-b border-stone-100 pb-3">Detail Artikel & Jurnal</h2>
                
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">Judul Artikel (Title)</label>
                    <input type="text" id="postTitle" placeholder="Contoh: The Philosophy Behind Our Chiffon" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-xs text-stone-800 focus:outline-none focus:border-stone-400">
                </div>

                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">URL Gambar Utama (Featured Image)</label>
                    <input type="text" id="postImage" placeholder="https://images.unsplash.com/..." class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-xs text-stone-800 focus:outline-none focus:border-stone-400">
                </div>

                <!-- Bagian Kontrol Penempatan Gambar (Baru) -->
                <div class="bg-stone-50 border border-stone-200/80 p-4 rounded-xl space-y-3">
                    <label class="block text-xs font-semibold text-stone-700 uppercase tracking-wider">Opsi Penempatan Visual (Frontend Binding)</label>
                    
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" id="displayAsHero" class="w-4 h-4 accent-stone-900 rounded cursor-pointer">
                        <label for="displayAsHero" class="text-xs text-stone-700 cursor-pointer">
                            <strong>Jadikan Hero Background</strong> (Gunakan gambar ini sebagai latar belakang utama di halaman depan)
                        </label>
                    </div>

                    <div class="flex items-center space-x-3">
                        <input type="checkbox" id="displayAsSlider" class="w-4 h-4 accent-stone-900 rounded cursor-pointer">
                        <label for="displayAsSlider" class="text-xs text-stone-700 cursor-pointer">
                            <strong>Masukkan ke Slider Banner Atas</strong> (Tampilkan dalam rotasi gambar bagian atas)
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">Isi Artikel / Ringkasan Cerita</label>
                    <textarea id="postContent" rows="6" placeholder="Tulis cerita atau deskripsi jurnal di sini..." class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-xs text-stone-800 focus:outline-none focus:border-stone-400 leading-relaxed"></textarea>
                </div>
            </div>

        </div>
    </main>

    <!-- Script Firebase & Logic Blog Editor -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCMd3tOM2g8FNL96UIlGRE9cbq3UUvssrQ",
            authDomain: "restosync-saas.firebaseapp.com",
            projectId: "restosync-saas",
            storageBucket: "restosync-saas.firebasestorage.app",
            messagingSenderId: "780544019719",
            appId: "1:780544019719:web:e5fccb00a4981f2579c9a2"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function loadTenantPosts() {
            const tenantId = document.getElementById('tenantIdInput').value.trim().toLowerCase();
            if (!tenantId) return alert('Masukkan Tenant ID terlebih dahulu!');

            const container = document.getElementById('postListContainer');
            container.innerHTML = '<p class="text-stone-400 italic">Memuat data...</p>';

            db.collection("tenants").doc(tenantId).collection("posts").orderBy("createdAt", "desc").get().then((snapshot) => {
                container.innerHTML = '';
                if (snapshot.empty) {
                    container.innerHTML = '<p class="text-stone-400 italic">Belum ada artikel.</p>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const post = doc.data();
                    const item = document.createElement('div');
                    item.className = "p-3 bg-stone-50 border border-stone-200 rounded-xl cursor-pointer hover:bg-stone-100 transition";
                    item.innerHTML = `<p class="font-semibold text-stone-900">${post.title || 'Tanpa Judul'}</p>`;
                    item.onclick = () => {
                        document.getElementById('postTitle').value = post.title || '';
                        document.getElementById('postImage').value = post.imageUrl || '';
                        document.getElementById('postContent').value = post.content || '';
                        document.getElementById('displayAsHero').checked = !!post.displayAsHero;
                        document.getElementById('displayAsSlider').checked = !!post.displayAsSlider;
                    };
                    container.appendChild(item);
                });
            }).catch(err => {
                console.error(err);
                container.innerHTML = '<p class="text-red-500">Gagal memuat post.</p>';
            });
        }

        function saveBlogPost() {
            const tenantId = document.getElementById('tenantIdInput').value.trim().toLowerCase();
            if (!tenantId) return alert('Tenant ID wajib diisi!');

            const title = document.getElementById('postTitle').value.trim();
            if (!title) return alert('Judul artikel wajib diisi!');

            const payload = {
                title: title,
                imageUrl: document.getElementById('postImage').value,
                displayAsHero: document.getElementById('displayAsHero').checked,
                displayAsSlider: document.getElementById('displayAsSlider').checked,
                content: document.getElementById('postContent').value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            const docId = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
            document.getElementById('blogStatus').innerText = "Menyimpan artikel...";

            db.collection("tenants").doc(tenantId).collection("posts").doc(docId).set(payload, { merge: true }).then(() => {
                document.getElementById('blogStatus').innerText = "Artikel berhasil dipublikasikan!";
                document.getElementById('blogStatus').className = "text-xs text-emerald-600 font-semibold";
                loadTenantPosts();
                setTimeout(() => {
                    document.getElementById('blogStatus').innerText = "Siap mengelola artikel";
                    document.getElementById('blogStatus').className = "text-xs text-stone-500 italic";
                }, 3000);
            }).catch(err => {
                console.error(err);
                alert('Gagal menyimpan artikel.');
                document.getElementById('blogStatus').innerText = "Gagal menyimpan";
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadTenantPosts();
        });
    </script>
</body>
</html>
