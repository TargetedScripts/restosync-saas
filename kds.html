<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoSync KDS - Kitchen Display System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation / Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-4">
            <div class="bg-orange-600 text-white font-extrabold px-3 py-1.5 rounded-lg text-lg tracking-wider">
                RestoSync KDS
            </div>
            <div>
                <h1 id="storeNameHeader" class="text-xl font-bold text-white">Kitchen Display</h1>
                <p class="text-xs text-slate-400">Tenant: <span id="tenantDisplay" class="font-mono text-orange-400">Loading...</span></p>
            </div>
        </div>
        <div class="flex items-center space-x-6">
            <div id="liveClock" class="text-xl font-mono font-semibold text-slate-300">--:--:--</div>
            <button onclick="location.reload()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition">
                Refresh Orders
            </button>
        </div>
    </header>

    <!-- Main Content: Order Columns -->
    <main class="flex-1 p-6 grid grid-cols-1 md:grid-cols-3 gap-6 overflow-x-auto">
        
        <!-- Column 1: Pending Orders -->
        <div class="bg-slate-800/60 border border-slate-700 rounded-xl flex flex-col h-[calc(100vh-140px)]">
            <div class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center rounded-t-xl">
                <h2 class="font-bold text-lg text-amber-400 flex items-center gap-2">
                    <span>New Orders</span>
                    <span id="countPending" class="bg-amber-500/20 text-amber-400 text-xs px-2.5 py-0.5 rounded-full font-semibold">0</span>
                </h2>
            </div>
            <div id="colPending" class="p-4 flex-1 overflow-y-auto space-y-4">
                <!-- Orders will be injected here -->
            </div>
        </div>

        <!-- Column 2: Preparing Orders -->
        <div class="bg-slate-800/60 border border-slate-700 rounded-xl flex flex-col h-[calc(100vh-140px)]">
            <div class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center rounded-t-xl">
                <h2 class="font-bold text-lg text-blue-400 flex items-center gap-2">
                    <span>Preparing</span>
                    <span id="countPreparing" class="bg-blue-500/20 text-blue-400 text-xs px-2.5 py-0.5 rounded-full font-semibold">0</span>
                </h2>
            </div>
            <div id="colPreparing" class="p-4 flex-1 overflow-y-auto space-y-4">
                <!-- Orders will be injected here -->
            </div>
        </div>

        <!-- Column 3: Ready Orders -->
        <div class="bg-slate-800/60 border border-slate-700 rounded-xl flex flex-col h-[calc(100vh-140px)]">
            <div class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center rounded-t-xl">
                <h2 class="font-bold text-lg text-emerald-400 flex items-center gap-2">
                    <span>Ready for Pickup</span>
                    <span id="countReady" class="bg-emerald-500/20 text-emerald-400 text-xs px-2.5 py-0.5 rounded-full font-semibold">0</span>
                </h2>
            </div>
            <div id="colReady" class="p-4 flex-1 overflow-y-auto space-y-4">
                <!-- Orders will be injected here -->
            </div>
        </div>

    </main>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // Firebase Configuration (matching existing RestoSync SaaS project)
        const firebaseConfig = {
            projectId: "restosync-saas"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Parse Tenant ID from URL (?tenant=...)
        const urlParams = new URLSearchParams(window.location.search);
        const tenantId = urlParams.get('tenant') || 'bangkokthaipalmy';
        document.getElementById('tenantDisplay').innerText = tenantId;

        // Load Store Profile Name
        async function loadStoreProfile() {
            try {
                const tenantRef = doc(db, "tenants", tenantId);
                const snap = await getDoc(tenantRef);
                if (snap.exists() && snap.data().profile) {
                    document.getElementById('storeNameHeader').innerText = `${snap.data().profile.storeName || tenantId} - Kitchen Display`;
                }
            } catch (err) {
                console.error("Error loading store profile:", err);
            }
        }
        loadStoreProfile();

        // Live Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString();
        }, 1000);

        // Real-time listener for orders sub-collection: tenants/{tenantId}/orders
        const ordersRef = collection(db, "tenants", tenantId, "orders");

        onSnapshot(ordersRef, (snapshot) => {
            const pendingCol = document.getElementById('colPending');
            const preparingCol = document.getElementById('colPreparing');
            const readyCol = document.getElementById('colReady');

            pendingCol.innerHTML = '';
            preparingCol.innerHTML = '';
            readyCol.innerHTML = '';

            let pCount = 0, prCount = 0, rCount = 0;
            const orders = [];

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                orders.push({ id: docSnap.id, ...data });
            });

            // Sort by timestamp descending or ascending (oldest first for kitchen queue)
            orders.sort((a, b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));

            orders.forEach(order => {
                const status = order.status || 'Pending';
                const cardHTML = renderOrderCard(order);

                if (status === 'Pending') {
                    pCount++;
                    pendingCol.insertAdjacentHTML('beforeend', cardHTML);
                } else if (status === 'Preparing') {
                    prCount++;
                    preparingCol.insertAdjacentHTML('beforeend', cardHTML);
                } else if (status === 'Ready') {
                    rCount++;
                    readyCol.insertAdjacentHTML('beforeend', cardHTML);
                }
            });

            document.getElementById('countPending').innerText = pCount;
            document.getElementById('countPreparing').innerText = prCount;
            document.getElementById('countReady').innerText = rCount;

            if (pCount === 0) pendingCol.innerHTML = `<p class="text-slate-500 text-center py-8 text-sm">No new orders</p>`;
            if (prCount === 0) preparingCol.innerHTML = `<p class="text-slate-500 text-center py-8 text-sm">No orders in preparation</p>`;
            if (rCount === 0) readyCol.innerHTML = `<p class="text-slate-500 text-center py-8 text-sm">No ready orders</p>`;
        });

        // Render Individual Order Card
        function renderOrderCard(order) {
            const timeAgo = order.createdAt ? formatTimeAgo(order.createdAt.toMillis()) : 'Just now';
            let itemsList = '';
            
            if (order.items && Array.isArray(order.items)) {
                itemsList = order.items.map(item => `
                    <div class="flex justify-between items-start text-sm py-1 border-b border-slate-700/50">
                        <div>
                            <span class="font-bold text-white bg-slate-700 px-1.5 py-0.5 rounded text-xs mr-2">${item.quantity}x</span>
                            <span class="text-slate-200">${item.name}</span>
                        </div>
                    </div>
                `).join('');
            }

            let actionButton = '';
            if (order.status === 'Pending') {
                actionButton = `<button onclick="updateOrderStatus('${order.id}', 'Preparing')" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg font-semibold text-sm transition shadow">Start Preparing</button>`;
            } else if (order.status === 'Preparing') {
                actionButton = `<button onclick="updateOrderStatus('${order.id}', 'Ready')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg font-semibold text-sm transition shadow">Mark as Ready</button>`;
            } else if (order.status === 'Ready') {
                actionButton = `<button onclick="updateOrderStatus('${order.id}', 'Completed')" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 py-2 rounded-lg font-semibold text-sm transition shadow">Complete & Archive</button>`;
            }

            return `
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md flex flex-col justify-between space-y-3">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-mono font-bold text-orange-400 text-base">${order.orderId || order.id}</span>
                            <span class="text-xs text-slate-400">${timeAgo}</span>
                        </div>
                        <div class="text-xs text-slate-300 mb-3 bg-slate-900/50 p-2 rounded">
                            <p class="font-semibold text-white">Customer: ${order.customerName || 'Guest'}</p>
                            <p class="text-slate-400">Phone: ${order.customerPhone || 'N/A'}</p>
                        </div>
                        <div class="space-y-1 mb-3">
                            ${itemsList}
                        </div>
                    </div>
                    <div>
                        ${actionButton}
                    </div>
                </div>
            `;
        }

        // Helper: Format elapsed time
        function formatTimeAgo(timestamp) {
            const diffSec = Math.floor((Date.now() - timestamp) / 1000);
            if (diffSec < 60) return `${diffSec}s ago`;
            const diffMin = Math.floor(diffSec / 60);
            return `${diffMin}m ago`;
        }

        // Expose update function globally for inline onclick handlers
        window.updateOrderStatus = async function(orderId, newStatus) {
            try {
                const orderRef = doc(db, "tenants", tenantId, "orders", orderId);
                await updateDoc(orderRef, { status: newStatus });
            } catch (err) {
                console.error("Error updating order status:", err);
                alert("Failed to update order status. Please try again.");
            }
        };
    </script>
</body>
</html>
