<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoSync SaaS - Central Hub Router</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-zinc-950 text-stone-200 flex items-center justify-center min-h-screen">

    <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center space-y-4">
        <div class="inline-block p-3 bg-amber-500/10 text-amber-400 rounded-full text-2xl mb-2">
            <i class="fa-solid fa-route"></i>
        </div>
        <h1 class="font-bold text-lg text-white">Routing Tenant Dashboard</h1>
        <p id="statusText" class="text-xs text-stone-400">Mendeteksi konfigurasi layout tenant...</p>
        <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
            <div id="progressBar" class="bg-amber-500 h-full w-1/3 animate-pulse"></div>
        </div>
    </div>

    <script>
        // Konfigurasi Firebase Anda (Sesuai dengan sistem pusat RestoSync)
        const firebaseConfig = {
            apiKey: "AIzaSyCMd3tOM2g8FNL96UIlGRE9cbq3UUvssrQ",
            authDomain: "restosync-saas.firebaseapp.com",
            projectId: "restosync-saas",
            storageBucket: "restosync-saas.firebasestorage.app",
            messagingSenderId: "780544019719",
            appId: "1:780544019719:web:e5fccb00a4981f2579c9a2"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Ambil parameter tenant dari URL, misal: hub.html?tenant=BoluHalus
        const urlParams = new URLSearchParams(window.location.search);
        const TENANT_ID = urlParams.get('tenant');

        const statusText = document.getElementById('statusText');

        if (!TENANT_ID) {
            statusText.innerHTML = `<span class="text-red-400">Error: Parameter tenant tidak ditemukan di URL.</span>`;
        } else {
            statusText.innerText = `Memeriksa profil tenant [${TENANT_ID}]...`;

            // Ambil data tenant dari Firestore
            db.collection("tenants").doc(TENANT_ID).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    const templateType = data.templateType || 'standard-grid';

                    statusText.innerText = `Layout terdeteksi: ${templateType}. Mengalihkan...`;

                    // Routing otomatis berdasarkan templateType
                    setTimeout(() => {
                        if (templateType.includes('micro-cakery-blog') || templateType.includes('blog')) {
                            // Arahkan ke panel admin khusus blog/jurnal
                            window.location.href = `admin-blog.html?tenant=${TENANT_ID}`;
                        } else {
                            // Arahkan ke panel admin standar toko/restoran
                            window.location.href = `admin.html?tenant=${TENANT_ID}`;
                        }
                    }, 800);

                } else {
                    statusText.innerHTML = `<span class="text-red-400">Tenant [${TENANT_ID}] tidak terdaftar di database.</span>`;
                }
            }).catch((error) => {
                statusText.innerHTML = `<span class="text-red-400">Koneksi database gagal: ${error.message}</span>`;
            });
        }
    </script>
</body>
</html>
