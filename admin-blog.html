<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoSync SaaS - Post, Journal & Media Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase Compat SDK v9.22.0 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Basic styling for rich text editor content output */
        .rich-editor-content h1 { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem; }
        .rich-editor-content h2 { font-size: 1.25rem; font-weight: bold; margin-bottom: 0.5rem; }
        .rich-editor-content p { margin-bottom: 0.75rem; }
        .rich-editor-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .rich-editor-content ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
    </style>
</head>
<body class="bg-stone-50 min-h-screen text-stone-800 flex flex-col">

    <!-- Top Bar Admin -->
    <header class="bg-white border-b border-stone-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="flex items-center space-x-4">
            <a id="backBtn" href="admin.html" class="bg-stone-100 hover:bg-stone-200 text-stone-700 px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center space-x-2">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Admin</span>
            </a>
            <div class="flex items-center space-x-3">
                <span class="bg-stone-900 text-white text-xs px-2.5 py-1 rounded-md font-mono uppercase tracking-wider">RestoSync Admin</span>
                <h1 class="font-bold text-base text-stone-900">Post, Journal & Media Manager</h1>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-xs text-stone-500">Tenant: <span id="tenantDisplay" class="font-mono text-stone-900 font-bold">loading...</span></span>
            <span id="blogStatus" class="text-xs text-stone-500 italic">Ready to manage posts</span>
            <button onclick="saveBlogPost()" class="bg-stone-900 hover:bg-stone-800 text-white text-xs font-semibold px-4 py-2 rounded-xl transition shadow-sm flex items-center space-x-1.5">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Publish Article</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-6 py-10 grid grid-cols-1 md:grid-cols-3 gap-8 flex-1 w-full">
        
        <!-- Sidebar Tenant & Post List -->
        <div class="space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-stone-200/80 shadow-sm space-y-4">
                <h2 class="font-semibold text-sm text-stone-900 uppercase tracking-wider">Tenant Configuration</h2>
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">Tenant ID (URL Param)</label>
                    <input type="text" id="tenantIdInput" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2 text-xs font-mono text-stone-800 focus:outline-none focus:border-stone-400">
                </div>
                <button onclick="loadTenantPosts()" class="w-full bg-stone-100 hover:bg-stone-200 text-stone-800 text-xs font-semibold py-2 rounded-xl transition">
                    Load Post List
                </button>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-stone-200/80 shadow-sm space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="font-semibold text-sm text-stone-900 uppercase tracking-wider">Saved Articles</h2>
                    <button onclick="resetEditorForm()" class="text-xs text-stone-500 hover:text-stone-900 underline">Create New</button>
                </div>
                <div id="postListContainer" class="space-y-2 max-h-80 overflow-y-auto text-xs text-stone-600 pr-1">
                    <p class="text-stone-400 italic">Loading articles list...</p>
                </div>
            </div>
        </div>

        <!-- Form Editor Post & Visual Placement -->
        <div class="md:col-span-2 space-y-6">
            
            <div class="bg-white p-6 rounded-2xl border border-stone-200/80 shadow-sm space-y-4">
                <div class="flex justify-between items-center border-b border-stone-100 pb-3">
                    <h2 class="font-semibold text-sm text-stone-900 uppercase tracking-wider">Article & Journal Details</h2>
                    <span id="activeEditingId" class="text-[11px] font-mono text-stone-400">Mode: New</span>
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">Article Title *</label>
                    <input type="text" id="postTitle" placeholder="e.g., The Philosophy Behind Our Chiffon" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-xs text-stone-800 focus:outline-none focus:border-stone-400">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1.5">Category / Tags</label>
                        <input type="text" id="postCategory" placeholder="e.g., Recipes, Announcements" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-xs text-stone-800 focus:outline-none focus:border-stone-400">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1.5">Featured Image URL</label>
                        <div class="flex space-x-2">
                            <input type="text" id="postImage" placeholder="https://images.unsplash.com/..." class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-xs text-stone-800 focus:outline-none focus:border-stone-400">
                            <label class="bg-stone-100 hover:bg-stone-200 text-stone-700 px-3 py-2 rounded-xl text-xs font-medium cursor-pointer transition flex items-center whitespace-nowrap">
                                <i class="fa-solid fa-upload mr-1.5"></i> Upload
                                <input type="file" id="imageFile" accept="image/*" class="hidden" onchange="uploadFeaturedImage(this)">
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Visual Placement Options (Frontend Binding) -->
                <div class="bg-stone-50 border border-stone-200/80 p-4 rounded-xl space-y-3">
                    <label class="block text-xs font-semibold text-stone-700 uppercase tracking-wider">Visual Placement Options (Frontend Binding)</label>
                    
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" id="displayAsHero" class="w-4 h-4 accent-stone-900 rounded cursor-pointer">
                        <label for="displayAsHero" class="text-xs text-stone-700 cursor-pointer">
                            <strong>Set as Hero Background</strong> (Use this image as the main background on the storefront homepage)
                        </label>
                    </div>

                    <div class="flex items-center space-x-3">
                        <input type="checkbox" id="displayAsSlider" class="w-4 h-4 accent-stone-900 rounded cursor-pointer">
                        <label for="displayAsSlider" class="text-xs text-stone-700 cursor-pointer">
                            <strong>Include in Top Slider Banner</strong> (Display in the top rotating banner gallery)
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">Short Excerpt</label>
                    <textarea id="postExcerpt" rows="2" placeholder="Brief summary displayed on article cards..." class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2 text-xs text-stone-800 focus:outline-none focus:border-stone-400"></textarea>
                </div>

                <!-- Rich Text Editor Section -->
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">Full Article / Journal Content (Rich Text)</label>
                    
                    <!-- Formatting Toolbar -->
                    <div class="bg-stone-100 border border-stone-200 rounded-t-xl p-2 flex flex-wrap gap-1 items-center border-b-0">
                        <button type="button" onclick="formatText('bold')" class="p-1.5 px-2.5 rounded hover:bg-stone-200 text-stone-700 text-xs font-bold" title="Bold"><i class="fa-solid fa-bold"></i></button>
                        <button type="button" onclick="formatText('italic')" class="p-1.5 px-2.5 rounded hover:bg-stone-200 text-stone-700 text-xs italic" title="Italic"><i class="fa-solid fa-italic"></i></button>
                        <button type="button" onclick="formatText('underline')" class="p-1.5 px-2.5 rounded hover:bg-stone-200 text-stone-700 text-xs underline" title="Underline"><i class="fa-solid fa-underline"></i></button>
                        <span class="w-px h-4 bg-stone-300 mx-1"></span>
                        <button type="button" onclick="formatBlock('h1')" class="p-1.5 px-2 rounded hover:bg-stone-200 text-stone-700 text-xs font-bold" title="Heading 1">H1</button>
                        <button type="button" onclick="formatBlock('h2')" class="p-1.5 px-2 rounded hover:bg-stone-200 text-stone-700 text-xs font-bold" title="Heading 2">H2</button>
                        <button type="button" onclick="formatBlock('p')" class="p-1.5 px-2 rounded hover:bg-stone-200 text-stone-700 text-xs" title="Paragraph">P</button>
                        <span class="w-px h-4 bg-stone-300 mx-1"></span>
                        <button type="button" onclick="formatText('insertUnorderedList')" class="p-1.5 px-2 rounded hover:bg-stone-200 text-stone-700 text-xs" title="Bullet List"><i class="fa-solid fa-list-ul"></i></button>
                        <button type="button" onclick="formatText('insertOrderedList')" class="p-1.5 px-2 rounded hover:bg-stone-200 text-stone-700 text-xs" title="Numbered List"><i class="fa-solid fa-list-ol"></i></button>
                        <span class="w-px h-4 bg-stone-300 mx-1"></span>
                        <button type="button" onclick="formatText('justifyLeft')" class="p-1.5 px-2 rounded hover:bg-stone-200 text-stone-700 text-xs" title="Align Left"><i class="fa-solid fa-align-left"></i></button>
                        <button type="button" onclick="formatText('justifyCenter')" class="p-1.5 px-2 rounded hover:bg-stone-200 text-stone-700 text-xs" title="Align Center"><i class="fa-solid fa-align-center"></i></button>
                        <button type="button" onclick="formatText('justifyRight')" class="p-1.5 px-2 rounded hover:bg-stone-200 text-stone-700 text-xs" title="Align Right"><i class="fa-solid fa-align-right"></i></button>
                    </div>

                    <!-- Editable Content Box -->
                    <div id="postContent" contenteditable="true" 
                        class="w-full bg-stone-50 border border-stone-200 rounded-b-xl p-3.5 min-h-[220px] max-h-[350px] overflow-y-auto text-xs text-stone-800 focus:outline-none focus:border-stone-400 leading-relaxed rich-editor-content">
                        Write your story or journal description here...
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Script Firebase & Blog Editor Logic -->
    <script>
        // Extract tenant parameter from URL (e.g., admin-blog.html?tenant=bangkokthaipalmy)
        const urlParams = new URLSearchParams(window.location.search);
        const tenantKey = urlParams.get('tenant') || 'boluhalus';
        
        document.getElementById('tenantIdInput').value = tenantKey;
        document.getElementById('tenantDisplay').textContent = tenantKey;
        document.getElementById('backBtn').href = `admin.html?tenant=${encodeURIComponent(tenantKey)}`;

        const firebaseConfig = {
            apiKey: "AIzaSyCMd3tOM2g8FNL96UIlGRE9cbq3UUvssrQ",
            authDomain: "restosync-saas.firebaseapp.com",
            projectId: "restosync-saas",
            storageBucket: "restosync-saas.firebasestorage.app",
            messagingSenderId: "780544019719",
            appId: "1:780544019719:web:e5fccb00a4981f2579c9a2"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        let allPosts = [];

        function loadTenantPosts() {
            const tenantId = document.getElementById('tenantIdInput').value.trim().toLowerCase();
            if (!tenantId) return alert('Please enter a Tenant ID first!');

            const container = document.getElementById('postListContainer');
            container.innerHTML = '<p class="text-stone-400 italic">Loading data...</p>';

            db.collection("tenants").doc(tenantId).collection("posts").orderBy("createdAt", "desc").get().then((snapshot) => {
                container.innerHTML = '';
                allPosts = [];

                if (snapshot.empty) {
                    container.innerHTML = '<p class="text-stone-400 italic">No articles found.</p>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const post = { id: doc.id, ...doc.data() };
                    allPosts.push(post);

                    const item = document.createElement('div');
                    item.className = "p-3 bg-stone-50 border border-stone-200 rounded-xl cursor-pointer hover:bg-stone-100 transition flex justify-between items-center group";
                    item.innerHTML = `
                        <div class="truncate pr-2">
                            <p class="font-semibold text-stone-900 truncate">${post.title || 'Untitled'}</p>
                            <p class="text-[10px] text-stone-400 uppercase">${post.category || 'General'}</p>
                        </div>
                        <button onclick="event.stopPropagation(); deletePost('${post.id}')" class="text-stone-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition p-1" title="Delete">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    `;
                    item.onclick = () => populateEditor(post);
                    container.appendChild(item);
                });
            }).catch(err => {
                console.error(err);
                container.innerHTML = '<p class="text-red-500">Failed to load posts.</p>';
            });
        }

        function populateEditor(post) {
            document.getElementById('activeEditingId').textContent = `ID: ${post.id}`;
            document.getElementById('postTitle').value = post.title || '';
            document.getElementById('postCategory').value = post.category || '';
            document.getElementById('postImage').value = post.imageUrl || post.image || '';
            document.getElementById('postExcerpt').value = post.excerpt || '';
            document.getElementById('postContent').innerHTML = post.content || '';
            document.getElementById('displayAsHero').checked = !!post.displayAsHero;
            document.getElementById('displayAsSlider').checked = !!post.displayAsSlider;
        }

        function resetEditorForm() {
            document.getElementById('activeEditingId').textContent = 'Mode: New';
            document.getElementById('postTitle').value = '';
            document.getElementById('postCategory').value = '';
            document.getElementById('postImage').value = '';
            document.getElementById('postExcerpt').value = '';
            document.getElementById('postContent').innerHTML = 'Write your story or journal description here...';
            document.getElementById('displayAsHero').checked = false;
            document.getElementById('displayAsSlider').checked = false;
        }

        // Rich Text Editor Command Helpers
        function formatText(command) {
            document.execCommand(command, false, null);
            document.getElementById('postContent').focus();
        }

        function formatBlock(blockTag) {
            document.execCommand('formatBlock', false, `<${blockTag}>`);
            document.getElementById('postContent').focus();
        }

        // Upload Image to Firebase Storage
        async function uploadFeaturedImage(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const tenantId = document.getElementById('tenantIdInput').value.trim().toLowerCase();
            const storageRef = storage.ref(`tenants/${tenantId}/blog/${Date.now()}_${file.name}`);
            
            setStatus("Uploading image to Storage...", "text-amber-600");
            try {
                const snapshot = await storageRef.put(file);
                const downloadURL = await snapshot.ref.getDownloadURL();
                document.getElementById('postImage').value = downloadURL;
                setStatus("Image uploaded successfully!", "text-emerald-600");
            } catch (err) {
                console.error("Storage upload error:", err);
                const localUrl = URL.createObjectURL(file);
                document.getElementById('postImage').value = localUrl;
                setStatus("Image loaded locally (Storage simulation)", "text-amber-600");
            }
        }

        function saveBlogPost() {
            const tenantId = document.getElementById('tenantIdInput').value.trim().toLowerCase();
            if (!tenantId) return alert('Tenant ID is required!');

            const title = document.getElementById('postTitle').value.trim();
            if (!title) return alert('Article title is required!');

            let docId = document.getElementById('activeEditingId').textContent;
            if (docId.startsWith('ID: ')) {
                docId = docId.replace('ID: ', '');
            } else {
                docId = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
            }

            const payload = {
                title: title,
                category: document.getElementById('postCategory').value.trim() || 'General',
                imageUrl: document.getElementById('postImage').value.trim(),
                excerpt: document.getElementById('postExcerpt').value.trim(),
                displayAsHero: document.getElementById('displayAsHero').checked,
                displayAsSlider: document.getElementById('displayAsSlider').checked,
                content: document.getElementById('postContent').innerHTML,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            setStatus("Saving article...", "text-stone-500");

            db.collection("tenants").doc(tenantId).collection("posts").doc(docId).get().then(docSnap => {
                if (!docSnap.exists) {
                    payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                }
                return db.collection("tenants").doc(tenantId).collection("posts").doc(docId).set(payload, { merge: true });
            }).then(() => {
                setStatus("Article published successfully!", "text-emerald-600 font-semibold");
                loadTenantPosts();
                setTimeout(() => setStatus("Ready to manage posts", "text-stone-500 italic"), 3000);
            }).catch(err => {
                console.error(err);
                alert('Failed to save article.');
                setStatus("Failed to save", "text-red-500");
            });
        }

        function deletePost(id) {
            if (!confirm('Are you sure you want to delete this article?')) return;
            const tenantId = document.getElementById('tenantIdInput').value.trim().toLowerCase();
            
            db.collection("tenants").doc(tenantId).collection("posts").doc(id).delete().then(() => {
                setStatus("Article successfully deleted", "text-emerald-600");
                resetEditorForm();
                loadTenantPosts();
            }).catch(err => {
                console.error(err);
                alert('Failed to delete article.');
            });
        }

        function setStatus(msg, className) {
            const statusEl = document.getElementById('blogStatus');
            statusEl.innerText = msg;
            statusEl.className = `text-xs ${className}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadTenantPosts();
        });
    </script>
</body>
</html>
