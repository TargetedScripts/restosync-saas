<!-- LOGO IMAGE URL DENGAN THUMBNAIL PREVIEW -->
<div>
    <label class="block text-stone-400 mb-1.5 font-semibold flex justify-between items-center">
        <span>Logo Image URL</span>
        <span id="logoPreviewContainer" class="hidden">
            <img id="logoThumb" src="" alt="Logo Preview" class="w-8 h-8 object-cover rounded-lg border border-amber-500/50 inline-block shadow">
        </span>
    </label>
    <input type="text" id="inputLogoUrl" oninput="updateImagePreview('inputLogoUrl', 'logoThumb', 'logoPreviewContainer')" class="w-full custom-input rounded-xl px-3.5 py-2.5 text-stone-200 font-mono" placeholder="assets/images/BangkokThaiLogo.png">
</div>
