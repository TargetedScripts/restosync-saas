<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoSync Gateway</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>

    <!-- Firebase Compat SDK v9.22.0 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-6">

    <!-- Top Spacer -->
    <div class="w-full max-w-md text-center pt-8">
        <span class="text-xs uppercase tracking-widest text-slate-500 font-semibold">RestoSync SaaS Gateway</span>
    </div>

    <!-- Main Container (Hidden by default, shows only if error/maintenance occurs) -->
    <div class="w-full max-w-md">
        
        <!-- Maintenance / Error Notice -->
        <div id="maintenance-section" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl text-center space-y-4">
            <div class="w-12 h-12 rounded-full bg-amber-500/10 text-[#f59e0b] flex items-center justify-center mx-auto text-xl font-bold border border-amber-500/20">
                !
            </div>
            <div>
                <h2 id="error-title" class="text-xl font-bold tracking-tight text-white">Service Unavailable</h2>
                <p id="error-subtitle" class="text-sm text-slate-400 mt-2">The requested tenant services are currently inactive or undergoing maintenance.</p>
            </div>
            <div class="pt-2">
                <a href="https://console.targetedscripts.com" class="inline-block w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-xl transition">
                    Return to Console
                </a>
            </div>
        </div>

    </div>

    <!-- Trace & Diagnostic Console (Toggleable via URL ?debug=true) -->
    <div id="debug-container" class="w-full max-w-md hidden">
        <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-left">
            <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800/60">
                <span class="text-[10px] uppercase font-mono text-slate-400 tracking-wider">Trace & Diagnostic Console</span>
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            </div>
            <div id="trace-console" class="font-mono text-[11px] text-slate-400 space-y-1 max-h-28 overflow-y-auto pr-1">
                <div>[ROUTER] System initialized. Seamless routing active.</div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="text-center pb-2">
        <span class="text-[11px] text-slate-500">&copy; TargetedScripts.com &bull; RestoSync SaaS Platform</span>
    </div>

    <!-- Router & Firebase Script -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tenantId = urlParams.get('tenant');
        const isDebug = urlParams.get('debug') === 'true';

        if (isDebug) {
            document.getElementById('debug-container').classList.remove('hidden');
        }

        function logTrace(message) {
            const consoleDiv = document.getElementById('trace-console');
            if (consoleDiv) {
                const timestamp = new Date().toISOString().split('T')[1].slice(0, 8);
                const line = document.createElement('div');
                line.textContent = `[${timestamp}] ${message}`;
                consoleDiv.appendChild(line);
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }
            console.log(`[ROUTER] ${message}`);
        }

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD... [Use your active project configuration]",
            authDomain: "restosync-saas.firebaseapp.com",
            projectId: "restosync-saas",
            storageBucket: "restosync-saas.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };

        // Initialize Firebase safely
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            logTrace("Firebase App initialized successfully.");
        } else {
            firebase.app();
            logTrace("Using existing Firebase App instance.");
        }

        const db = firebase.firestore();

        window.addEventListener('DOMContentLoaded', () => {
            if (!tenantId) {
                logTrace("ERROR: No 'tenant' parameter found in URL.");
                showMaintenanceState("Missing Tenant Parameter", "Please provide a valid tenant identifier in the URL.");
                return;
            }

            logTrace(`[ROUTER] Target Tenant ID detected: "${tenantId}"`);
            fetchTenantConfig(tenantId);
        });

        // Fetch Tenant Document from Firestore silently
        async function fetchTenantConfig(id) {
            try {
                logTrace(`Fetching document: tenants/${id}`);
                const docRef = db.collection("tenants").doc(id);
                const docSnap = await docRef.get();

                if (!docSnap.exists) {
                    logTrace(`ERROR: Tenant "${id}" not found in Firestore.`);
                    showMaintenanceState("Tenant Not Found", "The specified store configuration does not exist.");
                    return;
                }

                const tenantData = docSnap.data();
                logTrace(`Successfully retrieved configuration for "${id}".`);

                evaluateRouting(id, tenantData);

            } catch (error) {
                logTrace(`ERROR: Firestore read failed -> ${error.message}`);
                showMaintenanceState("Connection Error", "Unable to retrieve tenant configuration.");
            }
        }

        // Smart Routing Logic
        function evaluateRouting(id, data) {
            const enabledModules = data.enabledModules || { shop: false, blog: false };
            const defaultLanding = data.defaultLanding || 'shop';

            logTrace(`Feature Flags -> shop: ${enabledModules.shop}, blog: ${enabledModules.blog}`);
            logTrace(`Default Landing Preference -> ${defaultLanding}`);

            const shopActive = Boolean(enabledModules.shop);
            const blogActive = Boolean(enabledModules.blog);

            let targetUrl = '';

            // Condition C: Both modules inactive
            if (!shopActive && !blogActive) {
                logTrace("Routing Condition C: Both modules are disabled.");
                showMaintenanceState("Service Inactive", "This tenant's storefront and journal are currently offline.");
                return;
            }

            // Condition B: Only one module active
            if (shopActive && !blogActive) {
                logTrace("Routing Condition B: Only 'shop' is active. Redirecting...");
                targetUrl = `shop.html?tenant=${encodeURIComponent(id)}`;
            } else if (!shopActive && blogActive) {
                logTrace("Routing Condition B: Only 'blog' is active. Redirecting...");
                targetUrl = `blog.html?tenant=${encodeURIComponent(id)}`;
            } 
            // Condition A: Both active -> honor defaultLanding
            else {
                logTrace("Routing Condition A: Both modules active. Evaluating defaultLanding...");
                if (defaultLanding === 'blog') {
                    targetUrl = `blog.html?tenant=${encodeURIComponent(id)}`;
                } else {
                    targetUrl = `shop.html?tenant=${encodeURIComponent(id)}`;
                }
            }

            // Instant seamless redirect
            logTrace(`[ROUTER] Instant redirect to -> ${targetUrl}`);
            window.location.replace(targetUrl);
        }

        function showMaintenanceState(title, subtitle) {
            document.getElementById('maintenance-section').classList.remove('hidden');
            document.getElementById('error-title').textContent = title;
            document.getElementById('error-subtitle').textContent = subtitle;
            if (isDebug) {
                document.getElementById('debug-container').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
