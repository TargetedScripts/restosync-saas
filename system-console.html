<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoSync SaaS - Super Admin System Console</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .custom-card { background-color: #111827; border: 1px solid #1f2937; }
        .custom-input { background-color: #030712; border: 1px solid #1f2937; color: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-zinc-950">

    <!-- TOAST NOTIFICATION -->
    <div id="toastNotification" class="fixed bottom-6 right-6 px-5 py-3 rounded-2xl shadow-2xl text-white text-xs font-bold z-50 transition-all duration-300 opacity-0 pointer-events-none flex items-center space-x-2 bg-emerald-600">
        <i class="fa-solid fa-circle-check text-sm"></i>
        <span>Settings saved successfully!</span>
    </div>

    <!-- HEADER -->
    <header class="bg-[#111827] border-b border-[#1f2937] px-8 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-br from-amber-400 to-amber-600 text-zinc-950 rounded-xl flex items-center justify-center font-black shadow-lg shadow-amber-500/20">
                <i class="fa-solid fa-server"></i>
            </div>
            <div>
                <h1 class="font-bold text-white text-base">RestoSync SaaS &bull; Super Admin Console</h1>
                <p class="text-xs text-stone-400">Global Tenant & Feature Management Hub</p>
            </div>
        </div>
        <div>
            <button onclick="saveTenantSettings()" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 px-5 py-2.5 rounded-xl text-xs font-black shadow-lg transition flex items-center space-x-2">
                <i class="fa-solid fa-cloud-arrow-up"></i><span>Save to Firebase Cloud</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-8 py-8 w-full flex-grow space-y-6">
        
        <!-- TENANT SELECTOR -->
        <div class="custom-card rounded-3xl p-6 shadow-xl flex items-center justify-between flex-wrap gap-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-amber-400 mb-1">Select Active Tenant (Loaded from Firestore)</label>
                <select id="tenantSelect" onchange="switchTenant(this.value)" class="custom-input rounded-xl px-4 py-2.5 text-xs font-mono w-72 cursor-pointer">
                    <option value="">Loading tenants...</option>
                </select>
            </div>
            <div class="text-right">
                <span id="systemStatusBadge" class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full font-mono">System Operational</span>
            </div>
        </div>

        <!-- MODULES / FEATURE TOGGLES SECTION -->
        <div class="custom-card rounded-3xl p-6 space-y-6 shadow-xl">
            <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center space-x-2 border-b border-[#1f2937] pb-3">
                <i class="fa-solid fa-toggle-on text-sm"></i><span>Master Feature Toggles & Module Access</span>
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                <label class="flex items-center space-x-3 bg-[#030712] p-4 rounded-2xl border border-zinc-800 cursor-pointer hover:border-amber-500/50 transition">
                    <input type="checkbox" id="toggle_upload_logo" class="w-4 h-4 rounded text-amber-500 bg-zinc-900 border-zinc-700">
                    <div>
                        <strong class="block text-stone-200">Self Logo Upload & Resize</strong>
                        <span class="text-[10px] text-stone-400">Allow client to manage store logo.</span>
                    </div>
                </label>
                <label class="flex items-center space-x-3 bg-[#030712] p-4 rounded-2xl border border-zinc-800 cursor-pointer hover:border-amber-500/50 transition">
                    <input type="checkbox" id="toggle_custom_colors" class="w-4 h-4 rounded text-amber-500 bg-zinc-900 border-zinc-700">
                    <div>
                        <strong class="block text-stone-200">Theme Color Customization</strong>
                        <span class="text-[10px] text-stone-400">Allow modifying global palette colors.</span>
                    </div>
                </label>
                <label class="flex items-center space-x-3 bg-[#030712] p-4 rounded-2xl border border-zinc-800 cursor-pointer hover:border-amber-500/50 transition">
                    <input type="checkbox" id="toggle_online_ordering" class="w-4 h-4 rounded text-amber-500 bg-zinc-900 border-zinc-700">
                    <div>
                        <strong class="block text-stone-200">General Online Ordering</strong>
                        <span class="text-[10px] text-stone-400">Enable customer digital ordering cart.</span>
                    </div>
                </label>
                <label class="flex items-center space-x-3 bg-[#030712] p-4 rounded-2xl border border-zinc-800 cursor-pointer hover:border-amber-500/50 transition">
                    <input type="checkbox" id="toggle_qr_dine_in" class="w-4 h-4 rounded text-amber-500 bg-zinc-900 border-zinc-700">
                    <div>
                        <strong class="block text-stone-200">QR Dine-In Ordering</strong>
                        <span class="text-[10px] text-stone-400">Table QR code ordering support.</span>
                    </div>
                </label>
                <label class="flex items-center space-x-3 bg-[#030712] p-4 rounded-2xl border border-zinc-800 cursor-pointer hover:border-amber-500/50 transition">
                    <input type="checkbox" id="toggle_kitchen_display_system" class="w-4 h-4 rounded text-amber-500 bg-zinc-900 border-zinc-700">
                    <div>
                        <strong class="block text-stone-200">Kitchen Display (KDS)</strong>
                        <span class="text-[10px] text-stone-400">Live order routing to kitchen screen.</span>
                    </div>
                </label>
                <label class="flex items-center space-x-3 bg-[#030712] p-4 rounded-2xl border border-zinc-800 cursor-pointer hover:border-amber-500/50 transition">
                    <input type="checkbox" id="toggle_gst_calculation" class="w-4 h-4 rounded text-amber-500 bg-zinc-900 border-zinc-700">
                    <div>
                        <strong class="block text-stone-200">15% NZ GST Calculator</strong>
                        <span class="text-[10px] text-stone-400">Automatic tax breakdown for IRD compliance.</span>
                    </div>
                </label>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-[#030712] border-t border-[#1f2937] py-6 text-center text-xs text-stone-500">
        RestoSync SaaS System Console &bull; Centralized Enterprise Control Center
    </footer>

    <!-- FIREBASE & CONSOLE LOGIC -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCMd3tOM2g8FNL96UIlGRE9cbq3UUvssrQ",
            authDomain: "restosync-saas.firebaseapp.com",
            projectId: "restosync-saas",
            storageBucket: "restosync-saas.firebasestorage.app",
            messagingSenderId: "780544019719",
            appId: "1:780544019719:web:e5fccb00a4981f2579c9a2"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentActiveTenant = '';
        
        // Mapping kunci modul agar fleksibel mendeteksi berbagai variasi penamaan data di database
        const moduleMapping = {
            toggle_upload_logo: ['toggle_upload_logo', 'selfLogoUpload', 'logoUpload'],
            toggle_custom_colors: ['toggle_custom_colors', 'themeColorCustomization', 'customColors'],
            toggle_online_ordering: ['toggle_online_ordering', 'onlineOrdering', 'ordering'],
            toggle_qr_dine_in: ['toggle_qr_dine_in', 'qrDineIn', 'qrOrdering'],
            toggle_kitchen_display_system: ['toggle_kitchen_display_system', 'kitchenDisplay', 'kds'],
            toggle_gst_calculation: ['toggle_gst_calculation', 'gstCalculation', 'gst']
        };

        function showToast(message, isError = false) {
            const toast = document.getElementById('toastNotification');
            const text = toast.querySelector('span');
            text.innerText = message;
            toast.className = `fixed bottom-6 right-6 px-5 py-3 rounded-2xl shadow-2xl text-white text-xs font-bold z-50 transition-all duration-300 opacity-100 flex items-center space-x-2 ${isError ? 'bg-red-600' : 'bg-emerald-600'}`;
            setTimeout(() => {
                toast.className = toast.className.replace('opacity-100', 'opacity-0');
            }, 3500);
        }

        // LOAD TENANTS FROM FIRESTORE AUTOMATICALLY INTO DROPDOWN
        document.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('tenantSelect');
            
            db.collection("tenants").get().then((querySnapshot) => {
                select.innerHTML = "";
                let firstTenant = '';

                querySnapshot.forEach((doc) => {
                    const tid = doc.id;
                    if (!firstTenant) firstTenant = tid;

                    const opt = document.createElement('option');
                    opt.value = tid;
                    opt.innerText = tid.toUpperCase();
                    select.appendChild(opt);
                });

                // Prioritaskan bangkokthaipalmy jika ada di dalam Firestore
                select.value = 'bangkokthaipalmy';
                if (!select.value && firstTenant) select.value = firstTenant;
                
                if (select.value) {
                    switchTenant(select.value);
                }
            }).catch(err => {
                console.error("Error loading tenants:", err);
                showToast("Failed to fetch tenants from cloud.", true);
            });
        });

        function switchTenant(tenantId) {
            currentActiveTenant = tenantId;
            db.collection("tenants").doc(tenantId).get().then((doc) => {
                // Reset semua checkbox ke false terlebih dahulu
                Object.keys(moduleMapping).forEach(uiKey => {
                    const cb = document.getElementById(uiKey);
                    if (cb) cb.checked = false;
                });

                if (doc.exists) {
                    const data = doc.data();
                    
                    // Gabungkan semua data dari berbagai lapis dokumen (modules, config, atau root)
                    const rawData = { 
                        ...(data.modules || {}), 
                        ...(data.config?.modules || {}), 
                        ...data 
                    };

                    Object.entries(moduleMapping).forEach(([uiKey, possibleKeys]) => {
                        const checkbox = document.getElementById(uiKey);
                        if (checkbox) {
                            let isActive = false;
                            possibleKeys.forEach(k => {
                                if (rawData[k] === true) isActive = true;
                            });
                            checkbox.checked = isActive;
                        }
                    });
                }
            }).catch(err => {
                console.error("Error loading tenant modules:", err);
            });
        }

        function saveTenantSettings() {
            if (!currentActiveTenant) {
                alert("No tenant selected!");
                return;
            }

            let updatedModules = {};
            Object.keys(moduleMapping).forEach(uiKey => {
                const checkbox = document.getElementById(uiKey);
                if (checkbox) {
                    updatedModules[uiKey] = checkbox.checked;
                }
            });

            db.collection("tenants").doc(currentActiveTenant).set({
                modules: updatedModules,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(() => {
                showToast(`Modules for [${currentActiveTenant}] successfully updated!`);
            }).catch(err => {
                console.error("Error saving modules:", err);
                showToast("Failed to save to Firebase: " + err.message, true);
            });
        }
    </script>
</body>
</html>
