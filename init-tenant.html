<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoSync SaaS - Init Tenant "boluhalus"</title>
    <!-- Tailwind CSS untuk styling UI yang bersih -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6 space-y-6">
        <div>
            <h1 class="text-xl font-bold text-gray-800">RestoSync SaaS</h1>
            <p class="text-sm text-gray-500">Inisialisasi Dokumen Tenant: <span class="font-mono text-indigo-600 font-semibold">boluhalus</span></p>
        </div>

        <div class="space-y-4">
            <button id="initBtn" onclick="initializeTenant()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 shadow-sm cursor-pointer">
                Jalankan Inisialisasi Tenant
            </button>
            
            <div id="statusBox" class="hidden p-4 rounded-lg text-sm border"></div>
        </div>
    </div>

    <!-- Firebase SDK Modular (v9+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // ==========================================
        // KREDENSIAL FIREBASE ANDA
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCMd3tOM2g8FNL96UIlGRE9cbq3UUvssrQ",
            authDomain: "restosync-saas.firebaseapp.com",
            projectId: "restosync-saas",
            storageBucket: "restosync-saas.firebasestorage.app",
            messagingSenderId: "780544019719",
            appId: "1:780544019719:web:e5fccb00a4981f2579c9a2"
        };

        // Inisialisasi Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Ekspos fungsi ke scope global agar bisa dipanggil dari tombol onclick HTML
        window.initializeTenant = async function() {
            const btn = document.getElementById('initBtn');
            const statusBox = document.getElementById('statusBox');

            btn.disabled = true;
            btn.textContent = 'Menyimpan ke Firestore...';
            statusBox.className = 'hidden';

            try {
                // Struktur Data Standar Unified/Single Document Configuration
                const tenantData = {
                    tenantId: "boluhalus",
                    enabledModules: { 
                        blog: true, 
                        shop: true 
                    },
                    defaultLanding: "blog",
                    shopConfig: { 
                        storeName: "Bolu Halus Artisan", 
                        currency: "NZD", 
                        taxRate: 0.15 
                    },
                    blogConfig: { 
                        siteTitle: "Bolu Halus Weekly Drops", 
                        description: "Artisanal cakes NZ" 
                    },
                    updatedAt: serverTimestamp()
                };

                // Referensi dokumen ke koleksi "tenants" dengan ID "boluhalus"
                const tenantRef = doc(db, "tenants", "boluhalus");

                // Menggunakan setDoc dengan { merge: true } sesuai aturan arsitektur baru
                await setDoc(tenantRef, tenantData, { merge: true });

                // Tampilkan pesan sukses
                statusBox.className = 'p-4 rounded-lg text-sm bg-green-50 border-green-200 text-green-700 block';
                statusBox.innerHTML = `<strong>Berhasil!</strong> Dokumen tenant <code>boluhalus</code> telah dibuat/diperbarui di koleksi <code>tenants</code> pada proyek <code>restosync-saas</code>.`;
            } catch (error) {
                console.error("Error initializing tenant:", error);
                // Tampilkan pesan error
                statusBox.className = 'p-4 rounded-lg text-sm bg-red-50 border-red-200 text-red-700 block';
                statusBox.innerHTML = `<strong>Gagal:</strong> ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Jalankan Inisialisasi Tenant';
            }
        };
    </script>
</body>
</html>
