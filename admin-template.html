<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoSync - Visual & Template Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <!-- Tailwind Custom Palette -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        editorial: {
                            bg: '#FAF8F5',       
                            card: '#FFFFFF',     
                            dark: '#2D2A26',     
                            accent: '#E6CCB2',   
                            hover: '#D5BDA0',    
                            border: '#EBE5DE'    
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-editorial-bg text-editorial-dark font-sans min-h-screen pb-12">

    <!-- Top Navigation Bar -->
    <header class="bg-editorial-card border-b border-editorial-border sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <span class="bg-editorial-accent/20 text-editorial-dark p-2 rounded-lg text-sm font-semibold">
                <i class="fa-solid fa-palette mr-1"></i> TEMPLATE STUDIO
            </span>
            <h1 id="tenantTitle" class="text-sm font-medium tracking-wide">Tenant: Memuat...</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="goBackToHub()" class="text-xs text-stone-600 hover:text-stone-900 px-3 py-1.5 rounded border border-editorial-border transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Hub
            </button>
            <button onclick="saveTemplateSettings()" id="saveBtn" class="bg-editorial-dark text-editorial-bg hover:bg-stone-800 px-4 py-2 rounded-lg text-xs font-medium transition shadow-sm flex items-center space-x-1.5">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>Save Changes</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-6 mt-8 space-y-6">

        <!-- Status Notifikasi -->
        <div id="alertBox" class="hidden p-4 rounded-xl text-xs font-medium border transition-all"></div>

        <!-- Kartu Pengaturan Visual & Brand Identity -->
        <div class="bg-editorial-card border border-editorial-border rounded-2xl p-6 shadow-sm space-y-6">
            <div class="border-b border-editorial-border pb-4">
                <h2 class="text-base font-semibold text-stone-800 flex items-center">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2 text-stone-500"></i> Visual & Brand Identity
                </h2>
                <p class="text-xs text-stone-500 mt-1">Kelola identitas, tipe template, logo, skala ukuran, dan palet warna kustom.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Tenant Name -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-stone-700">Nama Toko / Brand Name</label>
                    <input type="text" id="tenantNameInput" class="w-full bg-editorial-bg border border-editorial-border rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-stone-500 transition" placeholder="Contoh: Bolu Halus">
                </div>

                <!-- Template Type Selector -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-stone-700">Tipe Layout Template</label>
                    <select id="templateTypeInput" class="w-full bg-editorial-bg border border-editorial-border rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-stone-500 transition">
                        <option value="blog">Editorial Blog / Storytelling (Bolu Halus)</option>
                        <option value="shop">Standard Store / POS Shop (Admin Standard)</option>
                    </select>
                </div>

                <!-- Color Customizer (Warna Teks & Aksen) -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-stone-700">Warna Teks Utama (Text Color)</label>
                    <div class="flex items-center space-x-3">
                        <input type="color" id="textColorInput" value="#2D2A26" class="w-10 h-10 rounded-lg border border-editorial-border cursor-pointer bg-editorial-bg p-1">
                        <span id="textColorHex" class="text-xs text-stone-500 font-mono">#2D2A26</span>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-stone-700">Warna Aksen / Tombol (Accent Color)</label>
                    <div class="flex items-center space-x-3">
                        <input type="color" id="accentColorInput" value="#E6CCB2" class="w-10 h-10 rounded-lg border border-editorial-border cursor-pointer bg-editorial-bg p-1">
                        <span id="accentColorHex" class="text-xs text-stone-500 font-mono">#E6CCB2</span>
                    </div>
                </div>

                <!-- Logo Section -->
                <div class="space-y-2 md:col-span-2 p-4 bg-editorial-bg/50 border border-editorial-border rounded-xl">
                    <label class="text-xs font-semibold text-stone-800 flex items-center justify-between">
                        <span>Logo Image (URL / Upload Firebase)</span>
                        <span id="uploadStatusLogo" class="text-[10px] text-stone-500"></span>
                    </label>
                    <div class="flex gap-3">
                        <input type="text" id="logoUrlInput" class="flex-1 bg-editorial-card border border-editorial-border rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-stone-500 transition" placeholder="https://firebasestorage.googleapis.com/...">
                        <label class="bg-editorial-accent hover:bg-editorial-hover text-stone-900 px-4 py-2 rounded-xl text-xs font-medium cursor-pointer transition flex items-center shadow-sm">
                            <i class="fa-solid fa-cloud-arrow-up mr-1.5"></i> Upload Logo
                            <input type="file" id="logoFileInput" class="hidden" accept="image/*" onchange="uploadImageFile(this, 'logo')">
                        </label>
                    </div>

                    <!-- Pengaturan Skala Persentase Ukuran Logo (+ / -) yang responsif -->
                    <div class="flex items-center justify-between pt-2 mt-2 border-t border-editorial-border">
                        <span class="text-xs text-stone-600 font-medium">Skala Ukuran Logo (%):</span>
                        <div class="flex items-center space-x-2">
                            <button type="button" onclick="adjustLogoScale(-10)" class="w-7 h-7 bg-editorial-card border border-editorial-border rounded-lg text-xs font-bold hover:bg-stone-100 transition">-</button>
                            <span id="logoScaleDisplay" class="text-xs font-semibold w-12 text-center">100%</span>
                            <button type="button" onclick="adjustLogoScale(10)" class="w-7 h-7 bg-editorial-card border border-editorial-border rounded-lg text-xs font-bold hover:bg-stone-100 transition">+</button>
                            <button type="button" onclick="resetLogoScale()" class="text-[10px] text-stone-500 underline ml-2 hover:text-stone-800">Reset</button>
                        </div>
                    </div>
                </div>

                <!-- Hero / Background Cover URL -->
                <div class="space-y-2 md:col-span-2 p-4 bg-editorial-bg/50 border border-editorial-border rounded-xl">
                    <label class="text-xs font-semibold text-stone-800 flex items-center justify-between">
                        <span>Hero / Background Cover Image</span>
                        <span id="uploadStatusHero" class="text-[10px] text-stone-500"></span>
                    </label>
                    <div class="flex gap-3">
                        <input type="text" id="heroImageInput" class="flex-1 bg-editorial-card border border-editorial-border rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-stone-500 transition" placeholder="URL gambar latar atau banner utama">
                        <label class="bg-editorial-accent hover:bg-editorial-hover text-stone-900 px-4 py-2 rounded-xl text-xs font-medium cursor-pointer transition flex items-center shadow-sm">
                            <i class="fa-solid fa-cloud-arrow-up mr-1.5"></i> Upload Cover
                            <input type="file" id="heroFileInput" class="hidden" accept="image/*" onchange="uploadImageFile(this, 'hero')">
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Live Preview Card dengan Skala Gambar Nyata -->
        <div class="bg-editorial-card border border-editorial-border rounded-2xl p-6 shadow-sm space-y-4">
            <h3 class="text-xs font-semibold tracking-wider uppercase text-stone-500">Live Preview Konsep Tampilan</h3>
            <div id="heroPreviewBox" class="p-8 rounded-xl bg-editorial-bg border border-editorial-border bg-cover bg-center transition-all relative overflow-hidden flex items-center space-x-6 shadow-inner">
                <div class="absolute inset-0 bg-black/15 backdrop-blur-[1px]"></div>
                
                <!-- Kotak Logo Preview dengan Kontainer Fleksibel agar Skala % Terlihat Nyata -->
                <div class="relative z-10 w-24 h-24 rounded-full bg-editorial-card border-2 border-white flex items-center justify-center overflow-hidden shadow-lg flex-shrink-0">
                    <img id="previewLogoImg" src="" alt="Logo" class="max-w-none transition-all hidden object-contain">
                    <span id="previewLogoFallback" class="font-bold text-stone-800 text-sm">BH</span>
                </div>

                <div class="relative z-10 text-white drop-shadow-md">
                    <h4 id="previewName" class="text-base font-bold">Bolu Halus</h4>
                    <p class="text-xs opacity-90">Template: <span id="previewType" class="font-medium">blog</span> | Logo Scale: <span id="previewScaleText">100%</span></p>
                </div>
            </div>
        </div>
    </main>

    <!-- Script Koneksi & Firestore & Storage Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCMd3tOM2g8FNL96UIlGRE9cbq3UUvssrQ",
            authDomain: "restosync-saas.firebaseapp.com",
            projectId: "restosync-saas",
            storageBucket: "restosync-saas.firebasestorage.app",
            messagingSenderId: "780544019719",
            appId: "1:780544019719:web:e5fccb00a4981f2579c9a2"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        const urlParams = new URLSearchParams(window.location.search);
        let TENANT_ID = urlParams.get('tenant');
        if (TENANT_ID) TENANT_ID = TENANT_ID.trim().toLowerCase();

        let currentLogoScale = 100;

        // Elemen DOM
        const tenantTitle = document.getElementById('tenantTitle');
        const tenantNameInput = document.getElementById('tenantNameInput');
        const templateTypeInput = document.getElementById('templateTypeInput');
        const textColorInput = document.getElementById('textColorInput');
        const accentColorInput = document.getElementById('accentColorInput');
        const textColorHex = document.getElementById('textColorHex');
        const accentColorHex = document.getElementById('accentColorHex');
        const logoUrlInput = document.getElementById('logoUrlInput');
        const heroImageInput = document.getElementById('heroImageInput');
        const previewName = document.getElementById('previewName');
        const previewType = document.getElementById('previewType');
        const previewLogoImg = document.getElementById('previewLogoImg');
        const previewLogoFallback = document.getElementById('previewLogoFallback');
        const previewScaleText = document.getElementById('previewScaleText');
        const heroPreviewBox = document.getElementById('heroPreviewBox');
        const alertBox = document.getElementById('alertBox');
        const logoScaleDisplay = document.getElementById('logoScaleDisplay');

        // Muat Data saat Halaman Dibuka
        window.addEventListener('DOMContentLoaded', () => {
            if (!TENANT_ID) {
                showAlert('Error: Parameter tenant tidak ditemukan di URL.', 'error');
                return;
            }

            tenantTitle.innerText = `Tenant: ${TENANT_ID}`;

            db.collection("tenants").doc(TENANT_ID).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    tenantNameInput.value = data.tenantName || '';
                    templateTypeInput.value = data.templateType || 'blog';
                    textColorInput.value = data.textColor || '#2D2A26';
                    accentColorInput.value = data.accentColor || '#E6CCB2';
                    textColorHex.innerText = textColorInput.value;
                    accentColorHex.innerText = accentColorInput.value;
                    logoUrlInput.value = data.logoUrl || '';
                    heroImageInput.value = data.heroImage || '';
                    currentLogoScale = data.logoScale ? Number(data.logoScale) : 100;

                    updatePreviewUI(data.tenantName, data.templateType, data.logoUrl, data.heroImage, currentLogoScale);
                } else {
                    showAlert('Data tenant belum ada di database, silakan buat dan simpan konfigurasi.', 'success');
                }
            }).catch((err) => {
                showAlert(`Gagal memuat data: ${err.message}`, 'error');
            });
        });

        // Event Listeners untuk Live Update
        tenantNameInput.addEventListener('input', (e) => { previewName.innerText = e.target.value || TENANT_ID; });
        templateTypeInput.addEventListener('change', (e) => { 
            previewType.innerText = e.target.value; 
            if(e.target.value === 'shop') {
                // Info jika memilih shop akan diarahkan ke admin.html standar
                console.log("Template diatur ke shop (akan mengarah ke admin.html)");
            }
        });
        textColorInput.addEventListener('input', (e) => { textColorHex.innerText = e.target.value; });
        accentColorInput.addEventListener('input', (e) => { accentColorHex.innerText = e.target.value; });
        logoUrlInput.addEventListener('input', (e) => { updateLogoPreviewImage(e.target.value); });
        heroImageInput.addEventListener('input', (e) => {
            if(e.target.value) heroPreviewBox.style.backgroundImage = `url('${e.target.value}')`;
        });

        function updatePreviewUI(name, type, logo, hero, scale) {
            previewName.innerText = name || TENANT_ID;
            previewType.innerText = type || 'blog';
            logoScaleDisplay.innerText = `${scale}%`;
            previewScaleText.innerText = `${scale}%`;

            if (logo) {
                logoUrlInput.value = logo;
                updateLogoPreviewImage(logo);
            }
            if (hero) {
                heroImageInput.value = hero;
                heroPreviewBox.style.backgroundImage = `url('${hero}')`;
            }
        }

        // Fungsi memperbarui gambar logo dan menerapkan ukuran piksel nyata berdasarkan persentase skala
        function updateLogoPreviewImage(url) {
            if (url && url.trim() !== '') {
                previewLogoImg.src = url;
                previewLogoImg.classList.remove('hidden');
                previewLogoFallback.classList.add('hidden');
                
                // Mengubah lebar gambar secara proporsional berdasarkan persentase (basis 60px)
                const computedSize = (currentLogoScale / 100) * 60;
                previewLogoImg.style.width = `${computedSize}px`;
                previewLogoImg.style.height = `${computedSize}px`;
            } else {
                previewLogoImg.classList.add('hidden');
                previewLogoFallback.classList.remove('hidden');
            }
        }

        // Pengatur Skala Persentase Logo (+ / -)
        function adjustLogoScale(amount) {
            currentLogoScale += amount;
            if (currentLogoScale < 30) currentLogoScale = 30; 
            if (currentLogoScale > 250) currentLogoScale = 250; 
            
            logoScaleDisplay.innerText = `${currentLogoScale}%`;
            previewScaleText.innerText = `${currentLogoScale}%`;
            
            if(logoUrlInput.value) {
                updateLogoPreviewImage(logoUrlInput.value);
            }
        }

        function resetLogoScale() {
            currentLogoScale = 100;
            logoScaleDisplay.innerText = `100%`;
            previewScaleText.innerText = `100%`;
            if(logoUrlInput.value) {
                updateLogoPreviewImage(logoUrlInput.value);
            }
        }

        // Fungsi Upload Gambar ke Firebase Storage
        function uploadImageFile(inputElement, targetType) {
            const file = inputElement.files[0];
            if (!file) return;

            const statusLabel = document.getElementById(targetType === 'logo' ? 'uploadStatusLogo' : 'uploadStatusHero');
            statusLabel.innerText = "Uploading (0%)...";

            const storageRef = storage.ref(`tenants/${TENANT_ID}/${targetType}_${Date.now()}_${file.name}`);
            const uploadTask = storageRef.put(file);

            uploadTask.on('state_changed', 
                (snapshot) => {
                    const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                    statusLabel.innerText = `Uploading (${progress}%)...`;
                }, 
                (error) => {
                    statusLabel.innerText = "Gagal upload!";
                    showAlert(`Upload error: ${error.message}`, 'error');
                }, 
                () => {
                    uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                        statusLabel.innerText = "Upload Berhasil!";
                        if (targetType === 'logo') {
                            logoUrlInput.value = downloadURL;
                            updateLogoPreviewImage(downloadURL);
                        } else {
                            heroImageInput.value = downloadURL;
                            heroPreviewBox.style.backgroundImage = `url('${downloadURL}')`;
                        }
                    });
                }
            );
        }

        // Fungsi Simpan ke Firestore
        function saveTemplateSettings() {
            if (!TENANT_ID) return;

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>Saving...</span>`;
            saveBtn.disabled = true;

            const updatedData = {
                tenantName: tenantNameInput.value.trim(),
                templateType: templateTypeInput.value.trim(),
                textColor: textColorInput.value,
                accentColor: accentColorInput.value,
                logoUrl: logoUrlInput.value.trim(),
                heroImage: heroImageInput.value.trim(),
                logoScale: currentLogoScale,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("tenants").doc(TENANT_ID).set(updatedData, { merge: true })
                .then(() => {
                    showAlert('Pengaturan visual, logo, skala, & warna berhasil disimpan ke database!', 'success');
                    saveBtn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i><span>Save Changes</span>`;
                    saveBtn.disabled = false;
                })
                .catch((error) => {
                    showAlert(`Gagal menyimpan: ${error.message}`, 'error');
                    saveBtn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i><span>Save Changes</span>`;
                    saveBtn.disabled = false;
                });
        }

        function showAlert(message, type) {
            alertBox.classList.remove('hidden', 'bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-600', 'bg-red-500/10', 'border-red-500/20', 'text-red-600');
            if (type === 'success') {
                alertBox.classList.add('bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-600');
            } else {
                alertBox.classList.add('bg-red-500/10', 'border-red-500/20', 'text-red-600');
            }
            alertBox.innerText = message;
        }

        function goBackToHub() {
            window.location.href = `hub.html?tenant=${TENANT_ID}`;
        }
    </script>
</body>
</html>
