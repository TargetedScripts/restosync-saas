<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoSync SaaS - Blog / Micro-Cakery Admin Console</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-zinc-950 text-stone-200 min-h-screen flex flex-col">

    <!-- HEADER ADMIN -->
    <header class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="bg-amber-500 text-zinc-950 font-black px-2.5 py-1 rounded text-xs">BLOG ADMIN</span>
            <h1 id="tenantTitle" class="font-bold text-sm text-white">Loading Tenant...</h1>
        </div>
        <div class="flex items-center space-x-4 text-xs">
            <a href="hub.html" class="text-stone-400 hover:text-white transition"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Hub</a>
            <button onclick="logout()" class="bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded text-stone-300 transition">Logout</button>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full space-y-8">

        <!-- SECTION 1: KONTROL MINGGUAN (WEEKLY DROP & JURNAL) -->
        <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-4 mb-6">
                <div>
                    <h2 class="font-bold text-base text-white flex items-center space-x-2">
                        <i class="fa-solid fa-pen-nib text-amber-400"></i>
                        <span>Weekly Drop & Editorial Journal Control</span>
                    </h2>
                    <p class="text-xs text-stone-400 mt-0.5">Kelola cerita narasi, status drop aktif, dan galeri mingguan untuk halaman depan.</p>
                </div>
                <button onclick="saveEditorialContent()" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold px-4 py-2 rounded-xl text-xs shadow transition">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> Save Changes
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
                <div class="space-y-4">
                    <div>
                        <label class="block text-stone-400 mb-1 font-semibold">Drop ID / Edisi Minggu Ini</label>
                        <input type="text" id="dropIdInput" placeholder="e.g. 2026-w44" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-stone-400 mb-1 font-semibold">Judul Drop / Artikel</label>
                        <input type="text" id="dropTitleInput" placeholder="e.g. Smoked Vanilla & Blackberry Rustica" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-stone-400 mb-1 font-semibold">Status Drop</label>
                        <select id="dropActiveSelect" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                            <option value="true">Active (Tampil di Website Utama)</option>
                            <option value="false">Archived / Selesai</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-stone-400 mb-1 font-semibold">Cerita Jurnal / Catatan Pembuat (Story)</label>
                    <textarea id="dropStoryInput" rows="7" placeholder="Tulis cerita narasi di balik pembuatan kue minggu ini..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-white focus:outline-none focus:border-amber-500 leading-relaxed"></textarea>
                </div>
            </div>
        </section>

        <!-- SECTION 2: PEMANTAUAN PESANAN MASUK (KDS / INCOMING ORDERS) -->
        <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl">
            <div class="border-b border-zinc-800 pb-4 mb-6">
                <h2 class="font-bold text-base text-white flex items-center space-x-2">
                    <i class="fa-solid fa-list-check text-amber-400"></i>
                    <span>Live Reservation Orders (KDS Integration)</span>
                </h2>
                <p class="text-xs text-stone-400 mt-0.5">Daftar reservasi kue dari pelanggan yang masuk secara real-time.</p>
            </div>

            <div id="ordersContainer" class="space-y-3 text-xs">
                <p class="text-stone-500 font-mono italic">Memuat data pesanan...</p>
            </div>
        </section>

    </main>

    <!-- FIREBASE & ADMIN LOGIC SCRIPT -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCMd3tOM2g8FNL96UIlGRE9cbq3UUvssrQ",
            authDomain: "restosync-saas.firebaseapp.com",
            projectId: "restosync-saas",
            storageBucket: "restosync-saas.firebasestorage.app",
            messagingSenderId: "780544019719",
            appId: "1:780544019719:web:e5fccb00a4981f2579c9a2"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const TENANT_ID = urlParams.get('tenant') || 'BoluHalus';

        document.getElementById('tenantTitle').innerText = `Admin Panel • Tenant: ${TENANT_ID}`;

        // Load data tenant & drops saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            loadTenantEditorialData();
            loadTenantOrders();
        });

        function loadTenantEditorialData() {
            db.collection("tenants").doc(TENANT_ID).collection("drops").where("is_active", "==", true).get()
                .then((querySnapshot) => {
                    if (!querySnapshot.empty) {
                        const doc = querySnapshot.docs[0];
                        const data = doc.data();
                        
                        document.getElementById('dropIdInput').value = data.drop_id || '';
                        document.getElementById('dropTitleInput').value = data.title || '';
                        document.getElementById('dropStoryInput').value = data.story || '';
                        document.getElementById('dropActiveSelect').value = data.is_active ? "true" : "false";
                    }
                })
                .catch(err => console.error("Error loading drops:", err));
        }

        function saveEditorialContent() {
            const dropId = document.getElementById('dropIdInput').value;
            const title = document.getElementById('dropTitleInput').value;
            const story = document.getElementById('dropStoryInput').value;
            const isActive = document.getElementById('dropActiveSelect').value === "true";

            const payload = {
                drop_id: dropId,
                title: title,
                story: story,
                is_active: isActive,
                updated_at: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("tenants").doc(TENANT_ID).collection("drops").doc(dropId).set(payload, { merge: true })
                .then(() => {
                    alert("Konten editorial mingguan berhasil diperbarui!");
                })
                .catch(error => {
                    alert("Gagal menyimpan: " + error.message);
                });
        }

        function loadTenantOrders() {
            db.collection("tenants").doc(TENANT_ID).collection("orders")
                .orderBy("created_at", "desc")
                .onSnapshot((snapshot) => {
                    const container = document.getElementById('ordersContainer');
                    if (snapshot.empty) {
                        container.innerHTML = `<p class="text-stone-500 font-mono italic">Belum ada pesanan masuk.</p>`;
                        return;
                    }

                    let html = `<div class="divide-y divide-zinc-800">`;
                    snapshot.forEach((doc) => {
                        const order = doc.data();
                        html += `
                            py-3 flex justify-between items-center">
                                <div>
                                    <span class="font-bold text-white">${order.customer_name}</span> (${order.customer_phone})<br>
                                    <span class="text-stone-400">Item: <strong class="text-amber-400">${order.item}</strong></span>
                                </div>
                                <div class="text-right">
                                    <span class="px-2 py-1 bg-amber-500/10 text-amber-400 rounded font-mono font-bold">${order.status}</span>
                                    <span class="block text-[10px] text-stone-500 mt-1">${order.order_id || doc.id}</span>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                    container.innerHTML = html;
                });
        }

        function logout() {
            window.location.href = `hub.html?tenant=${TENANT_ID}`;
        }
    </script>
</body>
</html>
